version: "2"
sql:
  - engine: "sqlite"
    queries: "./sql/queries/"
    schema: "./sql/schema.sql"
    gen:
      go:
        package: "db"
        out: "./internal/db"
        emit_interface: true
        emit_json_tags: true
        emit_prepared_queries: false
        emit_exact_table_names: false
        emit_empty_slices: true
