syntax = "proto3";

package shared;

option go_package = "/pkg/packets";

message PingMessage {
  uint64 timestamp = 1;
}

message ChatMessage {
  string msg = 1;
}

message IdMessage {
  uint64 id = 1;
}

//...

message Packet {
  uint64 sender_id = 1;
  oneof msg {
    PingMessage ping = 2;
    ChatMessage chat = 3;
    IdMessage id = 4;
    //...
  }
}
