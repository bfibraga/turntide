syntax = "proto3";

package packets;

option go_package = "/pkg/packets";

// General

message PingMessage {
  uint64 timestamp = 1;
}

message ChatMessage {
  string msg = 1;
}

message IdMessage {
  uint64 id = 1;
}

// Authentication

message LoginRequestMessage {
  string username = 1;
  string password = 2;
}

message RegisterRequestMessage {
  string username = 1;
  string password = 2;
}

message OkResponseMessage {}

message DenyResponseMessage {
  string reason = 2;
}

// Lobby messages

message LobbyPlayerData {
  uint64 client_id = 1;
  string username = 2;
  bool is_ready = 3;
}

message LobbyData {
  string name = 1;
  int32 current_players = 2;
  int32 max_players = 3;
}

// List
message ListLobbiesRequest {
  // Pagination
  int32 page = 1;
  int32 page_size = 2;

  // Filters
  string name = 3;
  string format = 4;
  int32 state = 5;
}

message ListLobbiesResponse {
  int32 count = 1;
  repeated LobbyData lobbies = 2;
}

// Entry
message Packet {
  uint64 sender_id = 1;
  oneof msg {
    // General messages
    PingMessage ping = 2;
    ChatMessage chat = 3;
    IdMessage id = 4;

    // Authentication messages
    LoginRequestMessage login_request = 5;
    RegisterRequestMessage register_request = 6;
    OkResponseMessage ok_response = 7;
    DenyResponseMessage deny_response = 8;

    // Lobby messages
    // List
    ListLobbiesRequest list_lobbies_request = 9;
    ListLobbiesResponse list_lobbies_response = 10;

    // Game messages
  }
}
